<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brunch</title>
</head>
<body>
    <header>
        <h1>Brunch</h1>
        <a><img src="images/logo.svg"></a>
        <nav>
            <a href="menu.html">Menu</a>
            <a href="about.html">About</a>
            <a href="order.html">Order</a>
        </nav>
    </header>
    <main>
        <section class="order">
            <form>
                <h2>Place Order</h2>
                <div class="cloner">
                    <div class="container">
                        <template>
                            <div class="row">
                                <label>Coffee</label>
                                <select>
                                    <option value="drip-coffee">Drip Coffee</option>
                                    <option value="cafe-au-lait">Cafe Au Lait</option>
                                    <option value="americano">Americano</option>
                                    <option value="cappuccino">Cappuccino</option>
                                    <option value="latte">Latte</option>
                                    <option value="chai">Chai</option>
                                    <option value="matcha">Matcha</option>
                                    <option value="mocha">Mocha</option>
                                    <option value="cold-brew">Cold Brew</option>
                                    <option value="hot-chocolate">Hot Chocolate</option>
                                    <option value="shot-in-the-dark">Shot in the Dark</option>
                                    <option value="cafe-con-miel">Cafe con Miel</option>
                                    <option value="breve">Breve</option>
                                    <option value="dirty-chai">Dirty Chai</option>
                                    <option value="peppermint-mocha">Peppermint Mocha</option>
                                    <option value="affogato">Affogato</option>
                                </select>
                                <label>Size</label>
                                <select>
                                    <option value="small">Small 12 oz.</option>
                                    <option value="large">Large 16 oz.</option>
                                </select>
                                <label>Quantity</label>
                                <input type="number" value="1" min="1" max="10">
                                <a class="delete" onclick="removeRow(event)">x</a>
                            </div>
                        </template>
                        <a class="button"><span>+</span>Add Coffee</a>
                        <div>

                        </div>
                    </div>
                </div>
                <div class="cloner">
                    <div class="container">
                        <template>
                            <div class="row">
                                <label>Waffle</label>
                                <input type="number" value="1" min="1" max="10">
                                <label>Topping 1</label>
                                <select>
                                    <option value="cream-cheese">Sweetened Cream Cheese</option>
                                    <option value="blueberry">Blueberry Pie Filling</option>
                                    <option value="strawberry">Strawberry Pie Filling</option>
                                    <option value="yogurt">Yogurt</option>
                                    <option value="berries">Fresh Berries</option>
                                    <option value="chai">Chai</option>
                                    <option value="matcha">Matcha</option>
                                    <option value="mocha">Mocha</option>
                                    <option value="cold-brew">Cold Brew</option>
                                    <option value="hot-chocolate">Hot Chocolate</option>
                                    <option value="shot-in-the-dark">Shot in the Dark</option>
                                    <option value="cafe-con-miel">Cafe con Miel</option>
                                    <option value="breve">Breve</option>
                                    <option value="dirty-chai">Dirty Chai</option>
                                    <option value="peppermint-mocha">Peppermint Mocha</option>
                                    <option value="affogato">Affogato</option>
                                </select>
                            </div>
                        </template>
                        <a class="button"><span>+</span>Add Waffle</a>
                        <div>

                        </div>
                    </div>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <div>
            <a href="menu.html">Menu</a>
            <a href="about.html">About</a>
            <a href="order.html">Order</a>
            <a href="https://www.google.com/maps/dir//University+of+Wisconsin%E2%80%93Eau+Claire,+105+Garfield+Ave,+Eau+Claire,+WI+54701/data=!4m6!4m5!1m1!4e2!1m2!1m1!1s0x87f8bda1c1f99121:0x8e4f27fb702ea176?sa=X&ved=2ahUKEwjLp77P8rSCAxVsk2oFHXPQCZsQ48ADegQIGxAA">Brunch <br> 105 Garfield Ave<br> Eau Claire WI 54701</a>
            <div class="social">
                <a href="https://fb.com/"><img src="images/facebook-icon.svg"></a>
                <a href="https://instagram.com/"><img src="images/instagram-2.svg"></a>
            </div>
        </div>
    </footer>
</body>
</html>
